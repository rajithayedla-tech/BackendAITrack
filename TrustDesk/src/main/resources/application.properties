spring.application.name=TrustDesk

# SQLite
spring.datasource.url=jdbc:sqlite:trustdesk.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Qdrant - local vector database
trustdesk.qdrant.url=http://localhost:6333
trustdesk.qdrant.collection=trustdesk_knowledge
trustdesk.qdrant.dimension=768

# Ollama - local embedding model
trustdesk.ollama.url=http://localhost:11434
trustdesk.ollama.model=nomic-embed-text